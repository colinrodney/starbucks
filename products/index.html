    <!-- Include Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Replace with your project credentials from Project Settings > API
        const SUPABASE_URL = "https://gkfykmsmtkzbxzkwxoei.supabase.co"
        const SUPABASE_ANON_KEY = "sb_publishable_TPr5I48yz4ga-NKU_z5KIg_eASVbzu0"
        
        const supabase_client = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

        async function fetchProducts() {
            const { data: products, error } = await supabase_client
            .from('products')
            .select('*');
            console.log(products)

            if (error) {
            console.error('Error fetching data:', error);
            return;
            }

            renderProducts(products);
        }

        function renderProducts(products) {
            const container = document.getElementById('product-grid');
            container.innerHTML = ''; // Clear hardcoded HTML elements

            products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image_url}" alt="${product.name}" />
                <p class="product-name">${product.name}</p>
                <p>${product.description}</p>
                <span class="price">$${Number(product.price).toFixed(2)}</span>
            `;
            container.appendChild(card);
            });
        }

        // Load products on page load
        document.addEventListener('DOMContentLoaded', () => {fetchProducts()});
    </script>
